<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.replace("dark", "light");
        }
      } catch {
        // The default theme works when browser storage is unavailable.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colossus Tech Club | Akshaya Institute of Technology, Tumakuru</title>
    <link rel="icon" type="image/webp" href="/images/optimized/Colossus-logo-white-128.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <noscript>
      <style>
        #root [style*="opacity:0;"], #root [style="opacity:0"] { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
